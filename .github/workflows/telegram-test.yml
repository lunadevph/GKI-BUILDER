name: Luna Build Agent Test
description: >
  Validate the Luna Build Agent without triggering a kernel build.
  Runs the offline unit suite, then drives the agent through a full simulated
  pipeline (start, every stage, success) and a simulated compile failure.

on:
  workflow_dispatch:
    inputs:
      send_failure_simulation:
        description: 'Also simulate a failed compile (sends a FAILED message)'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  agent-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7

    - name: Verify configuration is present
      shell: bash
      env:
        TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        set -euo pipefail
        [ -n "$TG_TOKEN" ] || { echo "::error::TELEGRAM_BOT_TOKEN not set"; exit 1; }
        [ -n "$TG_CHAT_ID" ] || { echo "::error::TELEGRAM_CHAT_ID not set"; exit 1; }
        echo "Token present (${#TG_TOKEN} chars), chat id(s): $(printf '%s' "$TG_CHAT_ID" | tr ',' '\n' | wc -l)"

    - name: Verify bot token is valid
      shell: bash
      env:
        TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      run: |
        set -uo pipefail
        resp="$(curl --silent --show-error --fail-with-body --max-time 30 \
          "https://api.telegram.org/bot${TG_TOKEN}/getMe")" || {
          echo "::error::getMe failed - token rejected"; exit 1; }
        echo "$resp" | head -c 200
        case "$resp" in
          *'"ok":true'*) echo; echo "Token valid." ;;
          *) echo "::error::unexpected getMe reply"; exit 1 ;;
        esac

    - name: Run offline unit suite (no network)
      shell: bash
      run: bash .github/actions/telegram-notify/test_lib.sh

    - name: Verify stage wiring matches the canonical pipeline
      shell: bash
      run: |
        set -uo pipefail
        # Stages declared in lib.sh
        .github/actions/telegram-notify/lib.sh
        echo "canonical stages: ${#LUNA_STAGES[@]}"
        for s in "${LUNA_STAGES[@]}"; do echo "  - $s"; done
        echo
        # Stages the workflow actually notifies about, by NAME.
        echo "stage events wired in build.yml:"
        missing=0
        for s in "${LUNA_STAGES[@]}"; do
          if grep -qF "stage: '$s'" .github/workflows/build.yml; then
            echo "  ok      $s"
          else
            echo "  MISSING $s"
            missing=$((missing + 1))
          fi
        done
        if [ "$missing" -ne 0 ]; then
          echo "::error::$missing canonical stage(s) have no notification in build.yml"
          exit 1
        fi
        # Raw indices are banned: they are what allowed the wiring to drift.
        if grep -q 'stage_index:' .github/workflows/build.yml; then
          echo "::error::build.yml still uses raw stage_index values; wire stages by name"
          exit 1
        fi

    - name: Verify failure diagnostics against a real make log
      id: simdiag
      shell: bash
      run: |
        set -uo pipefail
        LOG="$RUNNER_TEMP/sim-build.log"
        # Written with printf rather than a heredoc: a heredoc body would have
        # to be indented past the YAML block scalar's indentation, and getting
        # that wrong silently terminates the block.
        {
          printf '  CC [M]  drivers/char/vt/vt.o\n'
          printf '  LD [M]  vmlinux\n'
          printf 'arm64-linux-gnu-ld: error: undefined reference to `__stack_chk_fail`\n'
          printf 'make[2]: *** [Makefile:1234: net/socket.o] Error 1\n'
          printf 'make: *** [Makefile:9912: Makefile] Error 2\n'
        } > "$LOG"
        OUT="$(bash .github/scripts/luna_error_extract.sh "$LOG")"
        echo "$OUT"
        case "$OUT" in
          *"undefined reference"*) echo "Extracted the real compiler error." ;;
          *) echo "::error::extractor did not surface the linker error"; exit 1 ;;
        esac
        case "$OUT" in
          *"net/socket.o"*) echo "Extracted the failing target." ;;
          *) echo "::error::extractor did not surface the failing target"; exit 1 ;;
        esac
        {
          echo 'path<<LUNA_LOG_EOF'
          printf '%s\n' "$LOG"
          echo 'LUNA_LOG_EOF'
        } >> "$GITHUB_OUTPUT"

    - name: 'Sim: start'
      uses: ./.github/actions/telegram-notify
      with:
        event: start
        stage: 'Environment Setup'
        build_name: '5.15.220-android13 (gki)'
        kernel_version: '5.15.220-android13-lts-KernelSU-Next'
        bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}

    - name: 'Sim: stage 1 Fetch Kernel Source'
      uses: ./.github/actions/telegram-notify
      with:
        event: stage
        stage: 'Fetch Kernel Source'
        build_name: '5.15.220-android13 (gki)'
        kernel_version: '5.15.220-android13-lts-KernelSU-Next'
        force: '1'
        bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}

    - name: 'Sim: stage 2 Apply Patches'
      uses: ./.github/actions/telegram-notify
      with:
        event: stage
        stage: 'Apply Patches'
        build_name: '5.15.220-android13 (gki)'
        kernel_version: '5.15.220-android13-lts-KernelSU-Next'
        force: '1'
        bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}

    - name: 'Sim: stage 5 Compile Kernel'
      uses: ./.github/actions/telegram-notify
      with:
        event: stage
        stage: 'Compile Kernel'
        build_name: '5.15.220-android13 (gki)'
        kernel_version: '5.15.220-android13-lts-KernelSU-Next'
        force: '1'
        bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}

    - name: 'Sim: build sample artifact info from real files'
      id: simart
      shell: bash
      run: |
        set -uo pipefail
        D="${{ runner.temp }}/AnyKernel3"
        mkdir -p "$D"
        head -c 1048576 /dev/urandom > "$D/Image"
        printf 'echo placeholder\n' > "$D/anykernel.sh"
        head -c 2048 /dev/urandom > "$D/dtb"
        F="${{ runner.temp }}/sim-artifacts.txt"
        bash .github/scripts/luna_artifact_info.sh "$D" 10 > "$F"
        echo "path=$F" >> "$GITHUB_OUTPUT"
        cat "$F"

    - name: 'Sim: success'
      uses: ./.github/actions/telegram-notify
      with:
        event: success
        build_name: '5.15.220-android13 (gki)'
        kernel_version: '5.15.220-android13-lts-KernelSU-Next'
        artifact_info_file: ${{ steps.simart.outputs.path }}
        bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}

    # ---------------- failure simulation (separate run id) ----------------
    - name: 'Sim: failure run start'
      if: inputs.send_failure_simulation
      uses: ./.github/actions/telegram-notify
      with:
        event: start
        stage: 'Environment Setup'
        build_name: '5.15.220-android13 (gki) [SIM FAIL]'
        kernel_version: '5.15.220-android13-lts-KernelSU-Next'
        bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}

    - name: 'Sim: failure at compile (real extracted diagnostics)'
      id: simdiagfail
      if: inputs.send_failure_simulation
      uses: ./.github/actions/build-diagnostics
      with:
        log_file: ${{ steps.simdiag.outputs.path }}
        fallback: 'simulated compile failure'

    - name: 'Sim: notify compile failure'
      if: inputs.send_failure_simulation
      uses: ./.github/actions/telegram-notify
      with:
        event: failure
        stage: 'Compile Kernel'
        failed_stage: 'Compile Kernel'
        error_summary: ${{ steps.simdiagfail.outputs.summary }}
        build_name: '5.15.220-android13 (gki) [SIM FAIL]'
        kernel_version: '5.15.220-android13-lts-KernelSU-Next'
        bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}

    - name: 'Sim: failure with no stage supplied (auto-attribution)'
      if: inputs.send_failure_simulation
      uses: ./.github/actions/telegram-notify
      with:
        event: failure
        error_summary: 'Failure with no stage supplied - the agent should name the furthest stage it reached.'
        build_name: '5.15.220-android13 (gki) [SIM FAIL]'
        kernel_version: '5.15.220-android13-lts-KernelSU-Next'
        bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}

    - name: Summary
      if: always()
      shell: bash
      run: |
        {
          echo "### Luna Build Agent test"
          echo
          echo "Check the Telegram channel for:"
          echo "- a RUNNING message that was edited in place through the pipeline"
          echo "- a SUCCESS message with real artifact sizes + sha256 prefixes"
          echo "- a FAILED message naming \`Compile Kernel\` and quoting the **real**"
          echo "  linker error extracted from a genuine make log, not \"see the run log\""
          echo
          echo "The terminal SUCCESS/FAILED messages are sent as new messages on"
          echo "purpose: Telegram raises no notification for an edited message, so"
          echo "editing the result would mean nobody was told the build finished."
          echo
          echo "If nothing arrived, the usual causes are: the bot is not an admin"
          echo "in the channel, or the chat id is wrong (channels look like \`-100...\`)."
        } >> "$GITHUB_STEP_SUMMARY"