name: 'Luna Build Agent'
description: 'Real-time Telegram monitoring for Luna kernel builds: tracks pipeline stages, edits one live message, and reports verified artifacts.'

inputs:
  event:
    description: 'start | stage | success | failure'
    required: true
  bot_token:
    description: 'Telegram bot token, passed in from the TELEGRAM_BOT_TOKEN secret.'
    required: false
    default: ''
  chat_id:
    description: 'Telegram chat id(s), comma separated. Passed from TELEGRAM_CHAT_ID.'
    required: false
    default: ''
  build_name:
    description: 'Human readable build identifier. Falls back to LUNA_BUILD_NAME.'
    required: false
    default: ''
  kernel_version:
    description: 'Kernel version string, e.g. 5.15.220-android13-lts-KernelSU-Next.'
    required: false
    default: ''
  stage_index:
    description: 'Zero-based index into the canonical pipeline. -1 when unknown. Ignored when `stage` is set.'
    required: false
    default: '-1'
  stage:
    description: 'Canonical stage NAME, e.g. "Compile Kernel". Preferred over `stage_index`; resolves via lib.sh so it can never drift.'
    required: false
    default: ''
  failed_stage:
    description: 'Name of the stage that failed.'
    required: false
    default: ''
  error_summary:
    description: 'Short error text. Sanitised and secret-scrubbed before sending.'
    required: false
    default: ''
  artifact_info_file:
    description: 'File of name|size|sha256 lines describing verified artifacts.'
    required: false
    default: ''
  progress_percent:
    description: 'Optional measured progress 0-100. Omit unless real data exists.'
    required: false
    default: ''
  force:
    description: 'Bypass the rate limiter (1 = always publish).'
    required: false
    default: '0'
  notify:
    description: 'Ping the chat for this update (1 = notify). Defaults to 0 for intermediate stages, 1 for terminal states.'
    required: false
    default: ''
  run_id:
    description: 'GitHub Actions run id.'
    required: false
    default: ${{ github.run_id }}
  run_attempt:
    description: 'GitHub Actions run attempt.'
    required: false
    default: ${{ github.run_attempt }}
  server_url:
    description: 'GitHub server URL.'
    required: false
    default: ${{ github.server_url }}
  repository:
    description: 'GitHub repository slug.'
    required: false
    default: ${{ github.repository }}
  state_dir:
    description: 'Where per-run agent state is kept.'
    required: false
    default: ${{ runner.temp }}

runs:
  using: 'composite'
  steps:
    - name: Publish build status
      shell: bash
      env:
        # Composite actions have no `secrets` context; the caller passes them in.
        TG_TOKEN: ${{ inputs.bot_token }}
        TG_CHAT_ID: ${{ inputs.chat_id }}
        EV: ${{ inputs.event }}
        BUILD_NAME: ${{ inputs.build_name }}
        KERNEL_VERSION: ${{ inputs.kernel_version }}
        STAGE_INDEX: ${{ inputs.stage_index }}
        STAGE_NAME: ${{ inputs.stage }}
        FAILED_STAGE: ${{ inputs.failed_stage }}
        ERROR_SUMMARY: ${{ inputs.error_summary }}
        ARTIFACT_INFO_FILE: ${{ inputs.artifact_info_file }}
        PROGRESS_PERCENT: ${{ inputs.progress_percent }}
        FORCE: ${{ inputs.force }}
        NOTIFY: ${{ inputs.notify }}
        RUN_ID: ${{ inputs.run_id }}
        RUN_ATTEMPT: ${{ inputs.run_attempt }}
        SERVER_URL: ${{ inputs.server_url }}
        REPOSITORY: ${{ inputs.repository }}
        STATE_DIR: ${{ inputs.state_dir }}
      run: |
        set -uo pipefail

        # Notifications are strictly best effort: a Telegram outage must never
        # fail a kernel build.
        if [ -z "${TG_TOKEN:-}" ] || [ -z "${TG_CHAT_ID:-}" ]; then
          echo "::warning::Luna Build Agent: Telegram is not configured (TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID missing). No notification will be sent."
          exit 0
        fi

        # shellcheck source=./lib.sh
        . "${{ github.action_path }}/lib.sh"

        export LUNA_TG_TOKEN="$TG_TOKEN"
        export LUNA_TG_CHAT_ID="$TG_CHAT_ID"
        export LUNA_RUN_ID="$RUN_ID"
        export LUNA_STATE_DIR="$STATE_DIR"
        export LUNA_KERNEL_VERSION="${KERNEL_VERSION:-${LUNA_KERNEL_VERSION:-}}"
        export LUNA_BUILD_NAME="${BUILD_NAME:-${LUNA_BUILD_NAME:-}}"
        export LUNA_RUN_URL="${SERVER_URL}/${REPOSITORY}/actions/runs/${RUN_ID}"
        export LUNA_PROGRESS_PERCENT="$PROGRESS_PERCENT"

        [ -n "$RUN_ATTEMPT" ] && [ "$RUN_ATTEMPT" != "1" ] && \
          LUNA_BUILD_NAME="${LUNA_BUILD_NAME} (retry #${RUN_ATTEMPT})"

        # Resolve the stage index. A stage NAME always wins over a raw index:
        # it is resolved against the canonical LUNA_STAGES list, so reordering
        # that list cannot silently desynchronise the workflow wiring.
        stage_idx="$STAGE_INDEX"
        if [ -n "${STAGE_NAME:-}" ]; then
          resolved="$(luna_stage_index "$STAGE_NAME")"
          if [ "$resolved" = "-1" ]; then
            luna_warn "unknown stage name '${STAGE_NAME}' - falling back to STAGE_INDEX"
          else
            stage_idx="$resolved"
          fi
        fi

        # Terminal states ping by default; intermediate updates are delivered
        # silently so a busy channel is not pinged every twenty seconds. The
        # caller can override either way with an explicit `notify`.
        silent="${NOTIFY:-}"
        if [ -z "$silent" ]; then
          case "$EV" in
            success|failure) silent=0 ;;
            *)               silent=1 ;;
          esac
        elif [ "$silent" = "1" ]; then
          silent=0
        else
          silent=1
        fi

        case "$EV" in
          start)
            luna_state_init >/dev/null
            luna_stage_set_current "${stage_idx:-0}" active
            msg="$(luna_render RUNNING "${stage_idx:-0}" '' '' "$ARTIFACT_INFO_FILE")"
            luna_publish "$msg" RUNNING 1 "$silent" 0 || true
            ;;

          stage)
            luna_stage_set_current "${stage_idx:-0}" active
            msg="$(luna_render RUNNING "${stage_idx:-0}" '' '' "$ARTIFACT_INFO_FILE")"
            luna_publish "$msg" RUNNING "${FORCE:-0}" "$silent" 0 || true
            ;;

          success)
            # Every stage completed: mark the whole pipeline done. The index is
            # derived from LUNA_STAGES rather than hardcoded, so adding a stage
            # cannot leave the last one stuck as pending.
            luna_stage_set_current "$LUNA_LAST_STAGE" done
            luna_state_set final "$(luna_now_epoch)"
            msg="$(luna_render SUCCESS "$LUNA_LAST_STAGE" '' '' "$ARTIFACT_INFO_FILE")"
            luna_publish "$msg" SUCCESS 1 "$silent" 1 || true
            ;;

          failure)
            idx="${stage_idx:-}"
            if [ -n "$idx" ] && [ "$idx" -ge 0 ] 2>/dev/null; then
              luna_stage_set_current "$idx" failed
            else
              # No usable stage was supplied. Rather than guessing a single
              # hardcoded label for every failure in the job, attribute it to
              # the furthest stage the pipeline actually reached.
              idx="$(luna_stage_furthest_idx)"
              if [ "$idx" -ge 0 ] 2>/dev/null; then
                luna_warn "no stage supplied for failure; attributing it to '${LUNA_STAGES[$idx]}' (furthest stage reached)"
                luna_stage_set_current "$idx" failed
              else
                luna_warn "failure reported before any stage was reached"
              fi
            fi
            # Name the stage when the caller did not, now that we know it.
            if [ -z "$FAILED_STAGE" ] && [ "$idx" -ge 0 ] 2>/dev/null; then
              FAILED_STAGE="${LUNA_STAGES[$idx]}"
            fi
            msg="$(luna_render FAILED "${idx:--1}" "$FAILED_STAGE" "$ERROR_SUMMARY" "$ARTIFACT_INFO_FILE")"
            luna_publish "$msg" FAILED 1 "$silent" 1 || true
            ;;

          *)
            echo "::warning::Luna Build Agent: unknown event '${EV}' - nothing sent."
            exit 0
            ;;
        esac
